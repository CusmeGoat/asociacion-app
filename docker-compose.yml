version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asociacion_db
    restart: always
    environment:
      POSTGRES_DB: asociacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: